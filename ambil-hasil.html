</style><style id="kk-pickup-plain-gray-final">html,body{background:#292b30!important;background-image:none!important}body:before,body:after,.panel:before,.panel:after,main.panel:before,main.panel:after{content:none!important;display:none!important;background:none!important}main.panel,.panel{background:#3a3c42!important;background-image:none!important;border:1px solid #858991!important;box-shadow:0 14px 38px #0004!important}#code{background:#292b30!important;background-image:none!important}#result,.notice,.entry{background:#303238!important;background-image:none!important}#lookup button{background:#b9bdc4!important;background-image:none!important;color:#202227!important}</style></head><body><main class="panel"><div style="text-align:center;font-size:36px">🎁</div><h1>Ambil Hasil Pesanan</h1><p>Masukkan kode rahasia yang diberikan setelah pesanan selesai.</p><form id="lookup"><label>Kode pesanan<input id="code" required autocomplete="off" placeholder="KK-..." maxlength="60"></label><button>Lihat Hasil Pesanan ✨</button></form><div id="result" role="status" class="notice hidden"></div><p><small>Jaga kode ini agar tidak diketahui orang lain. Link dari layanan penyimpanan eksternal mungkin memiliki pengaturan akses tersendiri.</small></p><a href="index.html">← Kembali ke Beranda</a></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id),result=$('result');let db;try{db=getFirestore(initializeApp(firebaseConfig))}catch(e){result.classList.remove('hidden');result.textContent='Sistem belum dikonfigurasi.'}
$('lookup').onsubmit=async e=>{e.preventDefault();result.classList.remove('hidden');result.textContent='Memeriksa kode...';if(!db)return;try{const code=$('code').value.trim().toUpperCase();if(!/^KK-[A-F0-9]{36}$/.test(code)){result.textContent='Format kode tidak sesuai.';return}const snap=await getDoc(doc(db,'hasil_pelanggan',code));if(!snap.exists()){result.textContent='Kode tidak ditemukan atau sudah tidak aktif.';return}const d=snap.data();result.replaceChildren();const h=document.createElement('h3');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.kind;result.append(h,p);if(d.status!=='Selesai'||d.paid===false){result.append(document.createTextNode('Pesanan belum siap diambil.'));return}const files=Array.isArray(d.media)?d.media:[];if(files.length){for(const f of files){const wrap=document.createElement('div');wrap.className='entry';if((f.type||'').startsWith('image/')){const img=document.createElement('img');img.src=f.url;img.alt=f.name||'Hasil foto';img.loading='lazy';img.style.cssText='display:block;max-width:100%;max-height:320px;object-fit:contain;margin:0 auto 10px';wrap.append(img)}else if((f.type||'').startsWith('video/')){const v=document.createElement('video');v.src=f.url;v.controls=true;v.preload='metadata';v.style.cssText='display:block;width:100%;max-height:320px;margin-bottom:10px';wrap.append(v)}const a=document.createElement('a');a.textContent='⬇ Unduh '+(f.name||'hasil');a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';wrap.append(a);result.append(wrap)}}else if(d.url||d.imageUrl){
for(const u of [d.url]){if(!u)continue;const a=document.createElement('a');a.textContent='🔗 Buka Link Undangan';a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';a.style.margin='12px 0';result.append(a);const b=document.createElement('button');b.textContent='Salin Link';b.type='button';b.onclick=()=>navigator.clipboard.writeText(u).then(()=>{b.textContent='✓ Link Disalin'}).catch(()=>{b.textContent='Gagal menyalin'});result.append(b)}
if(d.imageUrl){const box=document.createElement('div');box.className='entry';const image=document.createElement('img');image.src=d.imageUrl;image.alt='Gambar surat undangan';image.loading='lazy';image.style.cssText='display:block;width:100%;max-height:550px;object-fit:contain';box.append(image);const a=document.createElement('a');a.href=d.imageUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🖼️ Buka / Simpan Gambar Surat';a.style.cssText='display:block;margin:12px 0';box.append(a);result.append(box)}
}else result.append(document.createTextNode('Hasil pesanan belum tersedia.'))}catch(err){result.textContent='Tidak dapat membuka hasil. Pastikan kode benar dan aturan Firebase hasil pelanggan sudah dipasang. Detail: '+err.message}};
</script></body></html>
