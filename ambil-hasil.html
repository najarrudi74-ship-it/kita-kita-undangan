<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambil Pesanan — Kita-Kita Undangan</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fff2ed,#f5dce7);color:#402b35;padding:24px}.panel{max-width:650px;margin:25px auto;background:white;padding:28px;border-radius:24px;box-shadow:0 12px 35px #63334420}input,select,button{font:inherit;padding:13px;border-radius:12px;width:100%;margin:7px 0 15px;border:1px solid #e3c6d0}button{background:#a75574;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}label{display:block;font-weight:600}a{color:#8f3c60}small{color:#77616b}.notice{padding:12px;background:#fff4f6;border-radius:12px;overflow-wrap:anywhere}.hidden{display:none}.entry{border:1px solid #edd5de;padding:12px;margin:10px 0;border-radius:12px;overflow-wrap:anywhere}</style><style id="kk-mobile-polish">@media(max-width:640px){html{-webkit-text-size-adjust:100%;scroll-padding-top:18px}body{max-width:100%;overflow-x:clip;-webkit-font-smoothing:antialiased}*,*:before,*:after{box-sizing:border-box}img,video,iframe,svg{max-width:100%}img{height:auto}h1,h2,h3,p,label,small{overflow-wrap:break-word}input,select,textarea{max-width:100%;font-size:16px!important}input,select,textarea,button{-webkit-tap-highlight-color:transparent}input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{min-height:44px}textarea{resize:vertical}button,a.btn,a.demo-btn,.actions button,[type=submit]{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #d6ad76;outline-offset:3px}.grid,.cards,.pw-grid{min-width:0}.grid>*,.cards>*,.pw-grid>*{min-width:0}.form,form{max-width:100%}.form input,.form select,.form textarea,form input,form select,form textarea{border-radius:12px}}@media(max-width:390px){.actions{flex-wrap:wrap}.actions>button,.actions>a{max-width:100%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}}</style></head><body><main class="panel"><div style="text-align:center;font-size:36px">🎁</div><h1>Ambil Hasil Pesanan</h1><p>Masukkan kode rahasia yang diberikan setelah pesanan selesai.</p><form id="lookup"><label>Kode pesanan<input id="code" required autocomplete="off" placeholder="KK-..." maxlength="60"></label><button>Lihat Hasil Pesanan ✨</button></form><div id="result" role="status" class="notice hidden"></div><p><small>Jaga kode ini agar tidak diketahui orang lain. Link dari layanan penyimpanan eksternal mungkin memiliki pengaturan akses tersendiri.</small></p><a href="index.html">← Kembali ke Beranda</a></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id),result=$('result');let db;try{db=getFirestore(initializeApp(firebaseConfig))}catch(e){result.classList.remove('hidden');result.textContent='Sistem belum dikonfigurasi.'}
$('lookup').onsubmit=async e=>{e.preventDefault();result.classList.remove('hidden');result.textContent='Memeriksa kode...';if(!db)return;try{const code=$('code').value.trim().toUpperCase();if(!/^KK-[A-F0-9]{36}$/.test(code)){result.textContent='Format kode tidak sesuai.';return}const snap=await getDoc(doc(db,'pesanan',code));if(!snap.exists()){result.textContent='Kode tidak ditemukan atau sudah tidak aktif.';return}const d=snap.data();result.replaceChildren();const h=document.createElement('h3');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.kind;result.append(h,p);if(d.status!=='Selesai'||d.paid===false){result.append(document.createTextNode('Pesanan belum siap diambil.'));return}const files=Array.isArray(d.media)?d.media:[];if(files.length){for(const f of files){const wrap=document.createElement('div');wrap.className='entry';if((f.type||'').startsWith('image/')){const img=document.createElement('img');img.src=f.url;img.alt=f.name||'Hasil foto';img.loading='lazy';img.style.cssText='display:block;max-width:100%;max-height:320px;object-fit:contain;margin:0 auto 10px';wrap.append(img)}else if((f.type||'').startsWith('video/')){const v=document.createElement('video');v.src=f.url;v.controls=true;v.preload='metadata';v.style.cssText='display:block;width:100%;max-height:320px;margin-bottom:10px';wrap.append(v)}const a=document.createElement('a');a.textContent='⬇ Unduh '+(f.name||'hasil');a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';wrap.append(a);result.append(wrap)}}else if(d.url||d.imageUrl){
for(const u of [d.url]){if(!u)continue;const a=document.createElement('a');a.textContent='🔗 Buka Link Undangan';a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';a.style.margin='12px 0';result.append(a);const b=document.createElement('button');b.textContent='Salin Link';b.type='button';b.onclick=()=>navigator.clipboard.writeText(u).then(()=>{b.textContent='✓ Link Disalin'}).catch(()=>{b.textContent='Gagal menyalin'});result.append(b)}
if(d.imageUrl){const box=document.createElement('div');box.className='entry';const image=document.createElement('img');image.src=d.imageUrl;image.alt='Gambar surat undangan';image.loading='lazy';image.style.cssText='display:block;width:100%;max-height:550px;object-fit:contain';box.append(image);const a=document.createElement('a');a.href=d.imageUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🖼️ Buka / Simpan Gambar Surat';a.style.cssText='display:block;margin:12px 0';box.append(a);result.append(box)}
}else result.append(document.createTextNode('Hasil pesanan belum tersedia.'))}catch(err){result.textContent='Tidak dapat membuka pesanan: '+err.message}};
</script></body></html>
